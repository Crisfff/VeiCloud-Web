<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />
    <title>Restablecer contraseña | VeiCloud</title>

    <style>
        :root {
            --bg: #050507;
            --card: #111116;
            --card2: #191920;
            --text: #ffffff;
            --muted: #aaaab4;
            --red: #e50914;
            --red2: #ff2634;
            --green: #40e084;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 5%, rgba(229, 9, 20, 0.20), transparent 35%),
                radial-gradient(circle at 90% 25%, rgba(255, 255, 255, 0.06), transparent 30%),
                linear-gradient(180deg, #050507, #09090d 45%, #050507);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .shell {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            width: 76px;
            height: 76px;
            border-radius: 24px;
            background:
                linear-gradient(145deg, #1c1c23, #0e0e13);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        .logo span {
            font-size: 34px;
            font-weight: 900;
            color: var(--red);
            letter-spacing: -2px;
        }

        .card {
            background: rgba(17, 17, 22, 0.94);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 28px;
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }

        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 34px;
            text-align: center;
            letter-spacing: -0.8px;
        }

        .subtitle {
            margin: 12px 0 26px;
            color: var(--muted);
            text-align: center;
            line-height: 22px;
            font-size: 15px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 13px;
            color: #d8d8df;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-wrap {
            height: 58px;
            border-radius: 18px;
            background: var(--card2);
            border: 1px solid rgba(255, 255, 255, 0.055);
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        input {
            width: 100%;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
        }

        input::placeholder {
            color: #777783;
        }

        .button {
            width: 100%;
            height: 58px;
            border: 0;
            border-radius: 19px;
            cursor: pointer;
            color: #ffffff;
            font-size: 16px;
            font-weight: 900;
            margin-top: 10px;
            background:
                linear-gradient(90deg, #760008, var(--red), var(--red2));
            box-shadow: 0 18px 50px rgba(229, 9, 20, 0.25);
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            box-shadow: none;
        }

        .message {
            min-height: 22px;
            margin-top: 18px;
            font-size: 14px;
            line-height: 20px;
            text-align: center;
            font-weight: 700;
        }

        .message.error {
            color: #ff5964;
        }

        .message.success {
            color: var(--green);
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.38);
            line-height: 18px;
        }

        .open-app {
            display: none;
            margin-top: 14px;
            text-decoration: none;
            color: #ffffff;
            border-radius: 18px;
            height: 54px;
            align-items: center;
            justify-content: center;
            background: #202028;
            font-size: 15px;
            font-weight: 900;
        }

        .open-app.visible {
            display: flex;
        }
    </style>
</head>

<body>
    <main class="shell">
        <div class="logo">
            <span>V</span>
        </div>

        <section class="card">
            <h1>Nueva contraseña</h1>

            <p class="subtitle">
                Crea una contraseña nueva para tu cuenta de VeiCloud.
            </p>

            <form id="resetForm">
                <div class="field">
                    <label for="newPassword">Nueva contraseña</label>
                    <div class="input-wrap">
                        <input
                            id="newPassword"
                            type="password"
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password"
                        />
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirmar nueva contraseña</label>
                    <div class="input-wrap">
                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Repite la contraseña"
                            autocomplete="new-password"
                        />
                    </div>
                </div>

                <button
                    id="saveButton"
                    class="button"
                    type="submit"
                >
                    Guardar contraseña
                </button>

                <div
                    id="message"
                    class="message"
                ></div>

                <a
                    id="openAppButton"
                    class="open-app"
                    href="veicloud://login"
                >
                    Abrir VeiCloud
                </a>
            </form>

            <div class="footer">
                Si el enlace venció, vuelve a la app y solicita uno nuevo.
            </div>
        </section>
    </main>

    <script>
        const form =
            document.getElementById("resetForm");

        const newPasswordInput =
            document.getElementById("newPassword");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const saveButton =
            document.getElementById("saveButton");

        const messageBox =
            document.getElementById("message");

        const openAppButton =
            document.getElementById("openAppButton");

        const urlParams =
            new URLSearchParams(window.location.search);

        const token =
            urlParams.get("token") || "";

        function setMessage(
            text,
            type
        ) {
            messageBox.textContent =
                text || "";

            messageBox.className =
                `message ${type || ""}`.trim();
        }

        function setLoading(
            loading
        ) {
            saveButton.disabled =
                loading;

            saveButton.textContent =
                loading
                    ? "Guardando..."
                    : "Guardar contraseña";
        }

        function openVeiCloud(
            appUrl
        ) {
            const target =
                appUrl || "veicloud://login";

            openAppButton.href =
                target;

            openAppButton.classList.add(
                "visible"
            );

            setTimeout(
                () => {
                    window.location.href =
                        target;
                },
                1300
            );
        }

        if (!token) {
            setMessage(
                "El enlace no es válido. Solicita uno nuevo desde la app.",
                "error"
            );

            saveButton.disabled =
                true;
        }

        form.addEventListener(
            "submit",
            async (
                event
            ) => {
                event.preventDefault();

                const newPassword =
                    newPasswordInput.value || "";

                const confirmPassword =
                    confirmPasswordInput.value || "";

                if (!token) {
                    setMessage(
                        "El enlace no es válido. Solicita uno nuevo desde la app.",
                        "error"
                    );

                    return;
                }

                if (newPassword.length < 6) {
                    setMessage(
                        "La nueva contraseña debe tener al menos 6 caracteres.",
                        "error"
                    );

                    return;
                }

                if (newPassword !== confirmPassword) {
                    setMessage(
                        "Las contraseñas no coinciden.",
                        "error"
                    );

                    return;
                }

                setLoading(true);
                setMessage("", "");

                try {
                    const response =
                        await fetch(
                            "/api/confirm-password-reset",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    Accept: "application/json"
                                },
                                body:
                                    JSON.stringify(
                                        {
                                            token,
                                            newPassword
                                        }
                                    )
                            }
                        );

                    const data =
                        await response.json().catch(
                            () => ({})
                        );

                    if (!response.ok || data.ok === false) {
                        throw new Error(
                            data.message ||
                            "No se pudo actualizar la contraseña."
                        );
                    }

                    setMessage(
                        "Contraseña actualizada correctamente. Abriendo VeiCloud...",
                        "success"
                    );

                    newPasswordInput.value =
                        "";

                    confirmPasswordInput.value =
                        "";

                    openVeiCloud(
                        data.appUrl || "veicloud://login"
                    );
                } catch (
                    error
                ) {
                    setMessage(
                        error.message ||
                        "No se pudo actualizar la contraseña.",
                        "error"
                    );
                } finally {
                    setLoading(false);
                }
            }
        );
    </script>
</body>
</html>
